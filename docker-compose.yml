services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: sqlite:////app/data/docgen.db
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-ollama,gemini,groq,openrouter}
      OLLAMA_BASE_URL: http://ollama:11434
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SOFFICE_PATH: /usr/bin/soffice
      STORE_HISTORY: "false"
    volumes:
      - docgen_data:/app/data
    profiles: ["default", "local"]

  web:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    profiles: ["default", "local"]
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    profiles: ["local"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  docgen_data:
  ollama_data:
