[project]
name = "docgen"
version = "0.1.0"
description = "Turn rough notes into compliance-grade, on-brand SOPs, setup guides and reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "python-docx>=1.1.2",
    "lxml>=5.3.0",
    "pillow>=11.0.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    "coloraide>=4.4.0",
    "cairosvg>=2.7.1",
    "markdown-it-py>=3.0.0",
    "rapidfuzz>=3.10.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "weasyprint>=70.0",
]

[project.optional-dependencies]
pii = ["presidio-analyzer>=2.2.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
docgen = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI File()/Form() and Typer Option() defaults are idiomatic
# E501: long prompt/span lines; UP042: keep str Enum for OpenAPI; E741: OKLCH `l`
ignore = ["B008", "E501", "UP042", "E741"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
warn_return_any = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
